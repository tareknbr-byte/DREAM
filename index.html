
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11100D">
<meta name="description" content="DREAM BY OISHY — luxury skincare and beauty essentials.">
<title>DREAM BY OISHY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#11100D;
  --ink:#F8F3E8;
  --card:#1C1A16;
  --gold:#C9A85C;
  --mut:#B5AD9D;
  --line:#7B6332;
  box-sizing:border-box;
  color-scheme:dark;
}
*,*::before,*::after { box-sizing:inherit; }
body {
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;
}
button,input,textarea { font:inherit;color:inherit; }
button { cursor:pointer; }
header {
  position:sticky;top:0;z-index:5;
  background:rgba(17,16,13,.96);
  border-bottom:1px solid #7B633255;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 20px;max-width:1180px;margin:auto;
}
.logo {
  font-family:"Playfair Display",serif;font-weight:700;
  font-size:1.35rem;letter-spacing:.08em;color:var(--gold);
}
.wrap { max-width:1180px;margin:auto;padding:0 20px 70px; }
.btn {
  display:inline-block;border:1px solid var(--gold);
  background:var(--gold);color:#11100D;font-weight:800;
  padding:10px 17px;border-radius:3px;text-decoration:none;
}
.btn.ghost { background:transparent;color:var(--ink); }
.btn:disabled { opacity:.5;cursor:not-allowed; }
.hero {
  padding:75px 0 55px;position:relative;
  border-bottom:1px solid #7B633255;margin-bottom:22px;
}
.hero h1 {
  font-family:"Playfair Display",serif;
  font-size:clamp(2.8rem,8vw,6.3rem);
  line-height:1;letter-spacing:-.035em;font-weight:500;
  margin:0;max-width:12ch;
}
.hero h1 em { font-style:normal;color:var(--gold); }
.hero p { max-width:42ch;color:var(--mut);margin-top:22px;line-height:1.8; }
.sticker {
  position:absolute;right:5%;top:55px;color:var(--gold);
  border:1px solid var(--gold);border-radius:50%;
  width:105px;height:105px;display:grid;place-items:center;
  text-align:center;font-family:"Playfair Display",serif;
  line-height:1.3;transform:rotate(8deg);
}
.chips { display:flex;gap:8px;overflow-x:auto;padding:6px 2px 14px; }
.chip {
  flex:none;border:1px solid #7B633288;background:transparent;
  border-radius:3px;padding:8px 16px;color:var(--mut);
}
.chip.on { background:var(--gold);color:#11100D; }
.grid { display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px; }
@media(min-width:700px) { .grid { grid-template-columns:repeat(4,minmax(0,1fr)); } }
.card {
  background:var(--card);border:1px solid #7B633255;
  border-radius:4px;padding:12px;display:flex;flex-direction:column;
  gap:9px;min-width:0;transition:transform .2s;
}
.card:hover { transform:translateY(-3px);border-color:var(--gold); }
.sw {
  position:relative;overflow:hidden;aspect-ratio:1;
  background:radial-gradient(circle at 30% 24%,#ffffff15,transparent 34%),var(--c,#3B3323);
}
.sw img { position:absolute;inset:0;width:100%;height:100%;object-fit:cover; }
.tag {
  position:absolute;left:10px;top:10px;background:var(--gold);
  color:#11100D;padding:5px 9px;font-size:.75rem;
}
.card h3 {
  margin:5px 0 0;font-family:"Playfair Display",serif;
  font-size:1.15rem;line-height:1.3;font-weight:500;
}
.cat,.small { color:var(--mut);font-size:.88rem; }
.cat { margin:0; }
.row { display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px; }
.price { font-weight:800;font-size:1.05rem; }
.card .btn { padding:7px 12px; }
.cartbtn i {
  font-style:normal;background:var(--ink);color:var(--bg);
  border-radius:99px;padding:0 7px;margin-left:6px;
}
.overlay {
  position:fixed;inset:0;background:#000b;z-index:10;
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet {
  background:var(--bg);border:1px solid var(--gold);
  border-radius:8px 8px 0 0;width:100%;max-width:540px;
  max-height:92vh;overflow:auto;padding:18px 16px 25px;
}
.sheet h2 { margin:0 0 10px;font-family:"Playfair Display",serif; }
.item {
  display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px dashed var(--mut);
}
.dot { width:34px;height:34px;border:1px solid var(--gold);background:var(--c);flex:none; }
.desc { flex:1;font-weight:600; }
.qty { display:flex;align-items:center;gap:8px; }
.qty button {
  width:30px;height:30px;border:1px solid var(--gold);
  background:var(--card);
}
.total { display:flex;justify-content:space-between;font-weight:800;font-size:1.3rem;margin:14px 0; }
.form { display:grid;gap:9px;margin:12px 0; }
.form input,.form textarea {
  width:100%;border:1px solid #7B633288;
  background:var(--card);border-radius:3px;padding:11px;
}
.big { display:block;width:100%;text-align:center;padding:13px; }
.empty { color:var(--mut);padding:16px 0; }
#toast {
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;
  border-radius:30px;opacity:0;transition:.2s;z-index:30;
}
#toast.show { opacity:1;transform:translate(-50%,0); }
footer {
  text-align:center;color:var(--mut);padding:32px 0;
  font-size:.9rem;border-top:1px solid #7B633255;margin-top:35px;
}
</style>
</head>
<body>
<header>
  <span class="logo">DREAM BY OISHY</span>
  <button class="btn cartbtn" id="open-cart">Bag<i id="bag-count">0</i></button>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Rituals of <em>radiance.</em></h1>
    <p>Discover elevated skincare and beauty essentials, thoughtfully chosen for your everyday glow. Shop the collection and order with ease.</p>
    <div class="sticker">THE<br>BEAUTY<br>EDIT</div>
  </section>

  <nav class="chips" id="categories" aria-label="Product categories"></nav>
  <div id="status" class="small" role="status"></div>
  <section class="grid" id="products" aria-label="Products"></section>

  <footer>DREAM BY OISHY · The art of everyday beauty</footer>
</main>

<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* IMPORTANT: Add your WhatsApp number below before accepting orders.
   Use country code and digits only, e.g. 8801XXXXXXXXX */
const WHATSAPP_NUMBER = "8801717715404";

const PRODUCTS = [
  {id:1,name:"Hydrating Lip Gloss",cat:"Lip Care",price:450,color:"#6A4B34",stock:true},
  {id:2,name:"Velvet Lip Tint",cat:"Lip Care",price:600,color:"#704139",stock:true},
  {id:3,name:"Soft Cream Blush",cat:"Makeup",price:700,color:"#8A5B45",stock:true},
  {id:4,name:"Golden Glow Highlighter",cat:"Makeup",price:800,color:"#B89A5A",stock:true},
  {id:5,name:"Everyday Eye Palette",cat:"Makeup",price:550,color:"#554638",stock:true},
  {id:6,name:"Volume Mascara",cat:"Makeup",price:650,color:"#302820",stock:false},
  {id:7,name:"Hydra Glow Serum",cat:"Skincare",price:1100,color:"#6F7866",stock:true},
  {id:8,name:"Daily Sun Gel SPF 50",cat:"Skincare",price:900,color:"#9A8352",stock:true}
];

const $ = selector => document.querySelector(selector);
const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[ch]));

let cart = {};
let category = "All";
let customer = {name:"",phone:"",address:"",notes:""};
let toastTimer;

const money = amount => new Intl.NumberFormat("en-BD", {
  style:"currency",currency:"BDT",maximumFractionDigits:0
}).format(Number(amount)||0);

function selectedProducts() {
  return PRODUCTS.filter(product => (cart[product.id] || 0) > 0);
}
function cartCount() {
  return selectedProducts().reduce((sum, product) => sum + cart[product.id], 0);
}
function cartTotal() {
  return selectedProducts().reduce((sum, product) => sum + product.price * cart[product.id], 0);
}
function toast(message) {
  const element = $("#toast");
  element.textContent = message;
  element.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => element.classList.remove("show"), 2600);
}
function renderCategories() {
  const categories = ["All", ...new Set(PRODUCTS.map(product => product.cat))];
  $("#categories").innerHTML = categories.map(cat =>
    `<button class="chip ${category===cat?"on":""}" data-cat="${escapeHTML(cat)}">${escapeHTML(cat)}</button>`
  ).join("");
}
function renderProducts() {
  const shown = PRODUCTS.filter(product => category==="All" || product.cat===category);
  $("#products").innerHTML = shown.map(product => `
    <article class="card">
      <div class="sw" style="--c:${escapeHTML(product.color)}">
        ${product.stock ? "" : '<b class="tag">SOLD OUT</b>'}
      </div>
      <h3>${escapeHTML(product.name)}</h3>
      <p class="cat">${escapeHTML(product.cat)}</p>
      <div class="row">
        <span class="price">${money(product.price)}</span>
        <button class="btn" data-add="${product.id}" ${product.stock?"":"disabled"}>Add</button>
      </div>
    </article>
  `).join("");
  $("#bag-count").textContent = cartCount();
}
function render() {
  renderCategories();
  renderProducts();
}
function orderMessage() {
  const lines = selectedProducts().map(product =>
    `• ${cart[product.id]} × ${product.name} — ${money(product.price * cart[product.id])}`
  ).join("\n");
  return `DREAM BY OISHY — NEW ORDER\n\n${lines}\n\nTotal: ${money(cartTotal())}\nName: ${customer.name}\nPhone: ${customer.phone}\nDelivery address: ${customer.address}${customer.notes ? "\nNotes: "+customer.notes : ""}`;
}
function renderCart() {
  $("#modal-root").innerHTML = `
    <div class="overlay" id="overlay">
      <section class="sheet" role="dialog" aria-modal="true">
        <h2>Your shopping bag</h2>
        ${selectedProducts().length ? selectedProducts().map(product => `
          <div class="item">
            <div class="dot" style="--c:${escapeHTML(product.color)}"></div>
            <div class="desc">${escapeHTML(product.name)}<br><small>${money(product.price)}</small></div>
            <div class="qty">
              <button data-dec="${product.id}" aria-label="Remove one">−</button>
              ${cart[product.id]}
              <button data-inc="${product.id}" aria-label="Add one">+</button>
            </div>
          </div>
        `).join("") : '<p class="empty">Your bag is empty. Add something you love.</p>'}
        <div class="total"><span>Total</span><span>${money(cartTotal())}</span></div>
        <div class="form">
          <input id="cust-name" placeholder="Your name" autocomplete="name" value="${escapeHTML(customer.name)}" required>
          <input id="cust-phone" placeholder="Phone number" autocomplete="tel" value="${escapeHTML(customer.phone)}" required>
          <input id="cust-address" placeholder="Delivery address" autocomplete="street-address" value="${escapeHTML(customer.address)}" required>
          <textarea id="cust-notes" rows="2" placeholder="Notes (optional)">${escapeHTML(customer.notes)}</textarea>
        </div>
        <button class="btn big" id="send-order" ${selectedProducts().length?"":"disabled"}>Order through WhatsApp</button>
        <p class="small">Your WhatsApp app will open with your order. You must press Send in WhatsApp to submit it.</p>
        <p style="text-align:center"><button class="btn ghost" id="close-cart">Keep shopping</button></p>
      </section>
    </div>`;
}
function closeCart() {
  $("#modal-root").innerHTML = "";
}
function sendOrder() {
  customer.name = $("#cust-name").value.trim();
  customer.phone = $("#cust-phone").value.trim();
  customer.address = $("#cust-address").value.trim();
  customer.notes = $("#cust-notes").value.trim();

  if (!selectedProducts().length) return toast("Please add a product first.");
  if (!customer.name || !customer.phone || !customer.address) {
    return toast("Please enter your name, phone number and address.");
  }
  const number = WHATSAPP_NUMBER.replace(/\D/g, "");
  if (!number) return toast("Shop owner: add your WhatsApp number in the code first.");

  const url = "https://wa.me/" + number + "?text=" + encodeURIComponent(orderMessage());
  window.open(url, "_blank", "noopener,noreferrer");
}

document.addEventListener("click", event => {
  const target = event.target;

  if (target.matches("[data-cat]")) {
    category = target.dataset.cat;
    renderCategories();
    renderProducts();
  }
  if (target.matches("[data-add]")) {
    const id = Number(target.dataset.add);
    cart[id] = (cart[id] || 0) + 1;
    renderProducts();
    toast("Added to your bag!");
  }
  if (target.id === "open-cart") renderCart();
  if (target.id === "close-cart" || target.id === "overlay") closeCart();

  if (target.matches("[data-inc]")) {
    const id = Number(target.dataset.inc);
    cart[id] = (cart[id] || 0) + 1;
    renderCart();
    renderProducts();
  }
  if (target.matches("[data-dec]")) {
    const id = Number(target.dataset.dec);
    cart[id] = (cart[id] || 0) - 1;
    if (cart[id] <= 0) delete cart[id];
    renderCart();
    renderProducts();
  }
  if (target.id === "send-order") sendOrder();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeCart();
});

render();
$("#status").textContent = "Welcome to DREAM BY OISHY. Select your favourites and add them to your bag.";
</script>
</body>
</html>
